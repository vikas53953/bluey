\* NotchLifecycle_redproof.cfg: the plan's own red proof (agent-trust plan 3.3, row 2.2), kept as a file you can
\* run by hand. Plant = "ApplyWithoutApprove" turns on BuggyApply, which applies a proposal that was never approved.
\* TLC must FAIL with "Invariant INV_APPLY_1 is violated" and print the counterexample trace.
\* Every other red proof, witness and fix run is generated by scripts/ci/run_tlc.sh from its run table.

CONSTANTS
    None = None
    MaxActive = 2
    Plant = "ApplyWithoutApprove"
    Fix = "none"

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT
    INV_APPLY_1
