\* NotchLifecycle_redproof.cfg: the red proof for INV_APPLY_1 (agent-trust plan 3.3, row 2.2).
\* PlantApplyWithoutApprove = TRUE turns on BuggyApply, which applies a proposal that was never approved.
\* TLC must FAIL with "Invariant INV_APPLY_1 is violated" and print the counterexample trace.

CONSTANTS
    None = None
    MaxActive = 2
    PlantApplyWithoutApprove = TRUE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANT
    INV_APPLY_1
