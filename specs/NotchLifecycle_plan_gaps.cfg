\* NotchLifecycle_plan_gaps.cfg: the plan's checks AS WRITTEN that today's code breaks.
\* Each one must FAIL with a counterexample. They are the honest record of the gaps for Vikas to decide
\* (docs/architecture/notch-lifecycle.md section 5), not bugs in the model.
\*
\* TLC stops at the first failure, so scripts/ci/run_tlc.sh runs each name below ON ITS OWN: it keeps the
\* lines above INVARIANTS as a header and appends one "INVARIANT <name>" or "PROPERTY <name>" per run.
\* The script also holds the same list; the doc, this file and the script move together.

CONSTANTS
    None = None
    MaxActive = 2
    PlantApplyWithoutApprove = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    INV_STOP_1          \* doc finding F4: Stop leaves the notch on Paused (and captures outlast Stop)
    INV_APPLY_2_FILE    \* doc finding F6: a second file undo re-applies the edit
    INV_FOCUS_1_EXACT   \* doc finding F9: a replaced session, or one open at quit, has no end event
    INV_PRIV_1_DEVICE   \* NEW, not in the doc yet: Talk-button audio left on with the indicator off

PROPERTIES
    INV_PRIV_2          \* doc finding F5: a focus check (and a spoken undo) starts capturing from Hidden
    LIVE_1_THINKING     \* doc finding F7: Thinking has no local timeout
