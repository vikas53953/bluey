name: perf-guards

# PR #142 / issue #124: pins what the idle-CPU fix ships and checks the perf diagnostic's own maths, on every PR.
#   - the PUBLISHED Boo.runtimeconfig.json must carry the pinned runtime settings (TieredPGO off, ...);
#   - scripts/perf self-tests (exact expected rows, exit 1 on any difference).
# The probe's counter mapping and reader are unit-tested in windows-ci (Boo.Core.Tests, Boo.Integration.Tests).
# GitHub-hosted only, no secrets, no AI.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-tests (runtime-settings check, diagnostic summary)
        run: |
          python -I scripts/perf/check_runtime_settings.py --self-test
          python -I scripts/perf/idle_diag_summary.py --self-test

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Boo.exe (same command as windows-ci)
        run: dotnet publish src/Boo.App/Boo.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/ci

      - name: Published runtime settings are the pinned ones
        run: python -I scripts/perf/check_runtime_settings.py check artifacts/ci
