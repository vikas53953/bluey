name: gate-manifest

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-manifest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: 'python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/ci/requirements-ci.txt'
      - name: Trusted base gate manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: pwsh
        run: |
          if ($env:BASE_SHA) {
            git cat-file -e "${env:BASE_SHA}:scripts/quality/gate_manifest.py" 2>$null
            if ($LASTEXITCODE -eq 0) {
              git show "${env:BASE_SHA}:scripts/quality/gate_manifest.py" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/base_gate_manifest.py"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git show "${env:BASE_SHA}:docs/quality/gate-manifest.json" | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/base_gate_manifest.json"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python -I "$env:RUNNER_TEMP/base_gate_manifest.py" --root . --manifest "$env:RUNNER_TEMP/base_gate_manifest.json"
              exit $LASTEXITCODE
            }
            Write-Output 'Base has no manifest yet; this PR introduces the contract.'
          }
          exit 0
      - name: Gate manifest self-test
        run: python -I scripts/quality/gate_manifest.py --self-test
      - name: Gate manifest
        run: python -I scripts/quality/gate_manifest.py
