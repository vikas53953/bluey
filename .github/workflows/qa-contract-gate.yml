name: qa-contract-gate
on:
  workflow_dispatch:
    inputs:
      plant_compile_failure:
        description: Plant a compile error on the throwaway VM to prove the harness build gate turns red
        type: boolean
        default: false
      plant_failure:
        type: boolean
        default: false
  pull_request:
    paths:
      - tools/Boo.QaSuite/**
      - tools/Boo.LiveSmoke/**
      - tools/Boo.VerifyLive/**
      - global.json
      - Directory.Build.*
      - .github/workflows/qa-contract-gate.yml
permissions:
  contents: read
jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Refuse unless GitHub's own VM
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { exit 1 }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Plant harness compile failure (red proof only)
        if: inputs.plant_compile_failure
        shell: pwsh
        run: Set-Content -LiteralPath tools/Boo.QaSuite/QaCompileRedProof.cs -Value '#error QA_COMPILE_RED_PROOF'
      - name: Compile all acceptance harnesses and enforce analyzers (no app or provider)
        shell: pwsh
        run: |
          foreach ($project in 'tools/Boo.QaSuite', 'tools/Boo.LiveSmoke', 'tools/Boo.VerifyLive') {
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contract regression cases and independent source mapping
        shell: pwsh
        run: |
          python -m pip install jsonschema==4.23.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/Boo.QaSuite/qa_gate.py --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin lane/face
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools/Boo.QaSuite/qa_gate.py --check-contract
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Deliberate acceptance failure (red proof)
        if: inputs.plant_failure
        shell: pwsh
        run: |
          python -I tools/Boo.QaSuite/qa_gate.py --red-proof
          exit $LASTEXITCODE
