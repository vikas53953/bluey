name: type-target

# TYPE-TARGET (issue #125): Boo's real DesktopTools types into a real two-field window (tools/Boo.TypeTarget.App).
# The approved field A is missing, read-only or not a value field while field B has keyboard focus; type_text must
# type nowhere and say so (tools/Boo.TypeTarget). A control case proves typing into a present field A still works.
#
# No key and no AI call: this workflow reads NO secrets, and starts no Boo.exe. It runs on every pull request (a few
# minutes on a hosted Windows VM, $0) and by hand. RUNS ONLY ON GITHUB'S OWN WINDOWS VM (windows-latest), never a
# personal PC: it drives the mouse and keyboard. Screenshots are of the test's own target window only.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: type-target-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  type-target:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - name: Refuse unless this is GitHub's own VM (never the owner's PC)
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            "::error title=Type-target refused::This job runs only on a GitHub-hosted runner (runner environment: '$($env:RUNNER_ENVIRONMENT)')."
            exit 1
          }
          "Runner: GitHub-hosted ($env:RUNNER_OS, $env:ImageOS)."

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Start with an empty evidence folder
        shell: pwsh
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts\type-target-evidence'
          if (Test-Path $evidence) { Remove-Item $evidence -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PyYAML for the key scan (hash-pinned)
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary=:all: -r scripts/ci/requirements-ci.txt

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build the two-field target app and the type-target test
        run: |
          dotnet build tools/Boo.TypeTarget.App -c Release -o artifacts/type-target-app
          dotnet build tools/Boo.TypeTarget -c Release

      - name: Approved field unusable, other field focused (Boo's DesktopTools against a real window)
        timeout-minutes: 10
        shell: pwsh
        env:
          BOO_TYPE_TARGET_EXE: ${{ github.workspace }}\artifacts\type-target-app\Boo.TypeTarget.App.exe
          BOO_TYPE_TARGET_ARTIFACTS: ${{ github.workspace }}\artifacts\type-target-evidence
        run: |
          & dotnet test tools/Boo.TypeTarget -c Release --no-build --logger trx --logger "console;verbosity=normal" --results-directory artifacts/type-target-evidence/trx
          $testExit = $LASTEXITCODE
          '----- observations -----'
          Get-ChildItem artifacts/type-target-evidence -Filter *.txt -ErrorAction SilentlyContinue | Sort-Object Name | ForEach-Object { "## $($_.Name)"; Get-Content $_.FullName }
          exit $testExit

      - name: Test gate (the test ran and passed; no empty or skipped run)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/assert-tests-ran.ps1 -ResultsDirectory artifacts/type-target-evidence/trx -SourceDirectory tools/Boo.TypeTarget

      - name: Key scan before upload (type-target evidence)
        id: keyscan_artifacts_type_target_evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $rc = 98
          try { python -I scripts/quality/key_scan.py --preflight --delete artifacts/type-target-evidence; $rc = $LASTEXITCODE } catch { $rc = 99 }
          if ($rc -eq 0 -or $rc -eq 10) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'safe=true' }
          if ($rc -eq 0) { exit 0 }
          if ($rc -ne 10) { Remove-Item -LiteralPath 'artifacts/type-target-evidence' -Recurse -Force -ErrorAction SilentlyContinue }
          if ($rc -ne 10 -and (Test-Path -LiteralPath 'artifacts/type-target-evidence')) { '::error::BOO-SAFE-002 the upload path could not be emptied after a failed key scan' }
          exit 1

      - name: Upload type-target evidence (screenshots, observations, test results)
        if: ${{ !cancelled() && steps.keyscan_artifacts_type_target_evidence.outputs.safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: type-target-evidence
          path: artifacts/type-target-evidence
          if-no-files-found: warn
          retention-days: 14
