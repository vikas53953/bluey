name: formal

# Phase 2, PR 2.2 of docs/plans/agent-trust-plan.md: the TLA+ model of the notch lifecycle (specs/), checked by TLC.
#   - specs/NotchLifecycle.cfg: the checks that hold for today's code must PASS.
#   - specs/NotchLifecycle_plan_gaps.cfg: the plan's checks that today's code breaks must each FAIL (the known gaps,
#     docs/architecture/notch-lifecycle.md section 5), so a gap cannot close or open without the doc moving too.
#   - specs/NotchLifecycle_redproof.cfg: a planted "Apply without Approve" bug must be caught.
# Linux only, no secrets, no .NET build. tla2tools.jar is a pinned release checked by SHA-256 before use.

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'scripts/ci/run_tlc.sh'
      - '.github/workflows/formal.yml'
      - 'docs/architecture/notch-lifecycle.md'
      - 'src/Boo.Core/NotchLifecycle*'
      - 'tests/**/NotchLifecycle*'
  push:
    branches: [lane/face, main]
    paths:
      - 'specs/**'
      - 'scripts/ci/run_tlc.sh'
      - '.github/workflows/formal.yml'
      - 'docs/architecture/notch-lifecycle.md'
      - 'src/Boo.Core/NotchLifecycle*'
      - 'tests/**/NotchLifecycle*'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: TLC (main must pass, each plan gap must fail, red proof must fail)
        run: bash scripts/ci/run_tlc.sh

      - name: Upload TLC output (traces for the gaps and the red proof)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tlc-output
          path: artifacts/tlc/*.log
          if-no-files-found: ignore
          retention-days: 7
