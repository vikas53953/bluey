name: formal

# Phase 2, PR 2.2 of docs/plans/agent-trust-plan.md: the TLA+ model of the notch lifecycle (specs/), checked by TLC.
#   - specs/NotchLifecycle.cfg: the checks that hold for today's code must PASS.
#   - specs/NotchLifecycle_plan_gaps.cfg: the plan's checks that today's code breaks must each FAIL (the known gaps,
#     docs/architecture/notch-lifecycle.md section 5), so a gap cannot close or open without the doc moving too.
#   - every main check catches its planted bug (red proof) and its trigger is reached (witness); every gap passes
#     with its own fix switch on. The run table is in scripts/ci/run_tlc.sh.
#   - nightly only (job tlc-wide): the main cfg again with MaxActive = 3 (more features overlapping at once).
# Linux only, no secrets, no .NET build. tla2tools.jar is a pinned release checked by SHA-256 before use.

on:
  pull_request:
    paths:
      - 'specs/**'
      - 'scripts/ci/run_tlc.sh'
      - '.github/workflows/formal.yml'
      - 'docs/architecture/notch-lifecycle.md'
      - 'src/Boo.Core/NotchLifecycle*'
      - 'tests/**/NotchLifecycle*'
  push:
    branches: [lane/face, main]
    paths:
      - 'specs/**'
      - 'scripts/ci/run_tlc.sh'
      - '.github/workflows/formal.yml'
      - 'docs/architecture/notch-lifecycle.md'
      - 'src/Boo.Core/NotchLifecycle*'
      - 'tests/**/NotchLifecycle*'
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      # Python + PyYAML (hash-pinned) for the key scan before the upload, as in the other workflows.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: PyYAML for the key scan (hash-pinned)
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary=:all: -r scripts/ci/requirements-ci.txt

      - name: TLC (main passes, red proofs caught, triggers reached, gaps fail today and pass with their fix)
        run: bash scripts/ci/run_tlc.sh

      # Key scan right before the upload (BOO-SAFE-002, generated from scripts/quality/key_scan.py; --check-workflows
      # rejects any edit). The upload runs ONLY if the scan reports safe=true.
      - name: Key scan before upload (TLC output)
        if: ${{ !cancelled() }}
        id: keyscan_artifacts_tlc
        shell: pwsh
        run: |
          $rc = 98
          try { python -I scripts/quality/key_scan.py --preflight --delete artifacts/tlc; $rc = $LASTEXITCODE } catch { $rc = 99 }
          if ($rc -eq 0 -or $rc -eq 10) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'safe=true' }
          if ($rc -eq 0) { exit 0 }
          if ($rc -ne 10) { Remove-Item -LiteralPath 'artifacts/tlc' -Recurse -Force -ErrorAction SilentlyContinue }
          if ($rc -ne 10 -and (Test-Path -LiteralPath 'artifacts/tlc')) { '::error::BOO-SAFE-002 the upload path could not be emptied after a failed key scan' }
          exit 1

      - name: Upload TLC output (traces for the gaps and the red proof)
        if: ${{ !cancelled() && steps.keyscan_artifacts_tlc.outputs.safe == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tlc-output
          path: artifacts/tlc
          if-no-files-found: ignore
          retention-days: 7

  tlc-wide:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      # Python + PyYAML (hash-pinned) for the key scan before the upload, as in the other workflows.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: PyYAML for the key scan (hash-pinned)
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary=:all: -r scripts/ci/requirements-ci.txt

      - name: TLC nightly (main cfg with MaxActive = 3)
        run: bash scripts/ci/run_tlc.sh --wide

      # Key scan right before the upload (BOO-SAFE-002, generated from scripts/quality/key_scan.py; --check-workflows
      # rejects any edit). The upload runs ONLY if the scan reports safe=true.
      - name: Key scan before upload (TLC output, nightly)
        if: ${{ !cancelled() }}
        id: keyscan_artifacts_tlc
        shell: pwsh
        run: |
          $rc = 98
          try { python -I scripts/quality/key_scan.py --preflight --delete artifacts/tlc; $rc = $LASTEXITCODE } catch { $rc = 99 }
          if ($rc -eq 0 -or $rc -eq 10) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'safe=true' }
          if ($rc -eq 0) { exit 0 }
          if ($rc -ne 10) { Remove-Item -LiteralPath 'artifacts/tlc' -Recurse -Force -ErrorAction SilentlyContinue }
          if ($rc -ne 10 -and (Test-Path -LiteralPath 'artifacts/tlc')) { '::error::BOO-SAFE-002 the upload path could not be emptied after a failed key scan' }
          exit 1

      - name: Upload TLC output
        if: ${{ !cancelled() && steps.keyscan_artifacts_tlc.outputs.safe == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tlc-output-wide
          path: artifacts/tlc
          if-no-files-found: ignore
          retention-days: 7
