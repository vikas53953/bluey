name: quality-gates

# Phase 1 of docs/plans/agent-trust-plan.md: deterministic checks that refuse a repeat mistake. Cheap: Linux, no .NET
# build, no artifacts (nothing to upload, so storage quota cannot turn it red).
#   - ratchet: today's count of each known-bad pattern in src/ (docs/quality/baseline.json) may only go DOWN.
#     A self-test first proves every rule fires on a planted sample, so a broken rule cannot pass vacuously.
# Rule texts and fixes: docs/quality/RULES.md. Job name `quality` is meant to become a required check.

on:
  push:
    branches: [lane/face, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ratchet self-test (every rule fires on a planted sample)
        run: python -I scripts/quality/ratchet.py --self-test

      - name: Ratchet (no known-bad pattern may go up)
        run: python -I scripts/quality/ratchet.py

      # A PR could raise its own baseline.json or weaken its own ratchet.py. So on a pull request the BASE branch's
      # ratchet and baseline (read from git, not from the PR) also judge the PR's code; only rises fail here.
      - name: Ratchet judged by the base branch's own copy (a PR cannot loosen its own gate)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:scripts/quality/ratchet.py 2>/dev/null; then
            git show FETCH_HEAD:scripts/quality/ratchet.py > "$RUNNER_TEMP/base_ratchet.py"
            git show FETCH_HEAD:docs/quality/baseline.json > "$RUNNER_TEMP/base_baseline.json"
            python -I "$RUNNER_TEMP/base_ratchet.py" --root "$GITHUB_WORKSPACE" --baseline "$RUNNER_TEMP/base_baseline.json" --rise-only
          else
            echo "The base branch ($BASE_REF) has no ratchet yet: this PR introduces it, so there is no older gate to apply."
          fi

      # Architecture references (docs/quality/RULES.md, BOO-REF-001..008): every src/ project may reference only the
      # projects, packages and frameworks in docs/architecture/layers.json. MSBuild itself reads the references
      # (evaluation only: no restore, no build), so Directory.Build.props, imports and conditions count; that needs the
      # SDK pinned in global.json. On a pull request the BASE branch's own arch_refs.py and layers.json (read from git,
      # not from the PR) also judge the PR's tree, and refuse a PR layers.json that allows more than the base one.
      - name: Set up .NET for the architecture check (MSBuild evaluation only)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Architecture references (self-test, then the tree against layers.json)
        run: |
          python -I scripts/quality/arch_refs.py --self-test
          python -I scripts/quality/arch_refs.py

      - name: Architecture references judged by the base branch's own copy (a PR cannot loosen its own layers)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git cat-file -e FETCH_HEAD:scripts/quality/arch_refs.py 2>/dev/null && git cat-file -e FETCH_HEAD:docs/architecture/layers.json 2>/dev/null; then
            git show FETCH_HEAD:scripts/quality/arch_refs.py > "$RUNNER_TEMP/base_arch_refs.py"
            git show FETCH_HEAD:docs/architecture/layers.json > "$RUNNER_TEMP/base_layers.json"
            python -I "$RUNNER_TEMP/base_arch_refs.py" --root "$GITHUB_WORKSPACE" --layers "$RUNNER_TEMP/base_layers.json" --rise-only --pr-layers "$GITHUB_WORKSPACE/docs/architecture/layers.json"
          else
            echo "The base branch ($BASE_REF) has no arch_refs.py and layers.json yet: this PR introduces them, so there is no older gate to apply."
          fi
