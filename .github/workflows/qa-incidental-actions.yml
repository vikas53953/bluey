name: qa-incidental-actions
on:
  pull_request:
    paths:
      - tools/Boo.QaSuite/MockContracts/IncidentalActionsTests.cs
      - .github/workflows/qa-incidental-actions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  incidental-actions:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Require hosted VM
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Hosted VM required' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact app and mock harness
        shell: pwsh
        run: |
          dotnet publish src/Boo.App/Boo.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/incidental-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/Boo.QaMockAi -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/Boo.QaSuite -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One mock j15e journey, no real AI and no retries
        shell: pwsh
        env:
          BOO_UI_EXE: ${{ github.workspace }}\artifacts\incidental-app\Boo.exe
          BOO_UI_ARTIFACTS: ${{ github.workspace }}\artifacts\incidental-actions
          BOO_CAPTURE_SCOPE: boo-windows
          BOO_DEMO_WORKSPACE: ${{ github.workspace }}\tests\fixtures\native\Boo.QaWorkspace
          BOO_QA_MOCK_LOG: ${{ github.workspace }}\artifacts\incidental-actions\mock-requests.log
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts/incidental-actions'
          New-Item -ItemType Directory -Force $evidence | Out-Null
          "app=$(git rev-parse HEAD)`nharness=$(git rev-parse HEAD)`nlabel=mock; real provider calls=0" | Set-Content "$evidence/identity.txt"
          Get-FileHash $env:BOO_UI_EXE | Format-List | Out-File "$evidence/exe-hash.txt"
          $hostsPath = Join-Path $env:SystemRoot 'System32/drivers/etc/hosts'
          $hostsBefore = [IO.File]::ReadAllBytes($hostsPath)
          $mock = $null
          $imported = @()
          try {
            Add-Content -LiteralPath $hostsPath -Value "`n127.0.0.1 api.openai.com"
            ipconfig /flushdns | Out-Null
            $cert = Join-Path $evidence 'mock-api-openai.cer'
            $dll = @(Get-ChildItem tools/Boo.QaMockAi/bin/Release -Recurse -Filter Boo.QaMockAi.dll)
            if ($dll.Count -ne 1) { throw 'Expected one mock binary' }
            $mock = Start-Process dotnet -ArgumentList "`"$($dll[0].FullName)`" --port 443 --cert-out `"$cert`" --log `"$env:BOO_QA_MOCK_LOG`" --workspace `"$env:BOO_DEMO_WORKSPACE`"" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$evidence/mock-stdout.txt" -RedirectStandardError "$evidence/mock-stderr.txt"
            $deadline = (Get-Date).AddSeconds(60)
            while (-not (Test-Path -LiteralPath $cert) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path -LiteralPath $cert)) { throw 'Mock did not create certificate' }
            $imported = @(Import-Certificate -FilePath $cert -CertStoreLocation Cert:\LocalMachine\Root)
            # GET health probe only: no extra /responses request can satisfy the test's paired receipt.
            $probe = Invoke-WebRequest https://api.openai.com/v1/models -TimeoutSec 15
            if ($probe.StatusCode -ne 200) { throw 'Mock health probe failed' }
            $test = 'Boo.QaSuite.MockContracts.IncidentalActionsTests.Q15E_PlainQuestion_RejectsActualIncidentalAction_WithoutApprovalOrFileChange'
            dotnet test tools/Boo.QaSuite -c Release --no-build --filter "FullyQualifiedName=$test" --logger trx --results-directory "$evidence/trx"
            $testExit = $LASTEXITCODE
            $files = @(Get-ChildItem "$evidence/trx" -Filter *.trx)
            if ($files.Count -ne 1) { throw 'Expected one TRX' }
            [xml]$trx = Get-Content $files[0].FullName -Raw
            $rows = @($trx.TestRun.Results.UnitTestResult)
            if ($rows.Count -ne 1 -or $rows[0].testName -ne $test -or $rows[0].outcome -ne 'Passed') { throw 'Exact mock j15e did not pass' }
            exit $testExit
          } finally {
            if ($mock) { Stop-Process -Id $mock.Id -Force -ErrorAction SilentlyContinue }
            [IO.File]::WriteAllBytes($hostsPath, $hostsBefore)
            ipconfig /flushdns | Out-Null
            foreach ($certificate in $imported) { Remove-Item -LiteralPath "Cert:\LocalMachine\Root\$($certificate.Thumbprint)" }
          }
      - name: Prepare scanner
        if: ${{ always() }}
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary=:all: -r scripts/ci/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Key scan before upload
        id: keyscan_artifacts_incidental_actions
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $rc = 98
          try { python -I scripts/quality/key_scan.py --preflight --delete artifacts/incidental-actions; $rc = $LASTEXITCODE } catch { $rc = 99 }
          if ($rc -eq 0 -or $rc -eq 10) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'safe=true' }
          if ($rc -eq 0) { exit 0 }
          if ($rc -ne 10) { Remove-Item -LiteralPath 'artifacts/incidental-actions' -Recurse -Force -ErrorAction SilentlyContinue }
          if ($rc -ne 10 -and (Test-Path -LiteralPath 'artifacts/incidental-actions')) { '::error::BOO-SAFE-002 the upload path could not be emptied after a failed key scan' }
          exit 1
      - name: Upload mock evidence
        if: ${{ !cancelled() && steps.keyscan_artifacts_incidental_actions.outputs.safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-incidental-actions
          path: artifacts/incidental-actions
          if-no-files-found: error
          retention-days: 7
