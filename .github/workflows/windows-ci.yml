name: windows-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not leave the job token in .git/config for later build/test steps.
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Boo.sln

      - name: Build
        run: dotnet build Boo.sln -c Release --no-restore

      # Provider tests use in-memory HTTP handlers; no OpenAI key or other secret is needed.
      - name: Core tests
        run: dotnet test tests/Boo.Core.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results/core

      - name: Integration tests
        run: dotnet test tests/Boo.Integration.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results/integration

      # Anthropic/Gemini/OpenAI text-provider clients against in-memory HTTP handlers; no key is needed.
      - name: Provider tests
        run: dotnet test tests/Boo.Providers.Tests -c Release --no-build --logger trx --results-directory artifacts/test-results/providers

      - name: Publish app
        run: dotnet publish src/Boo.App/Boo.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/ci

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: boo-win-x64
          path: artifacts/ci

      # Every notch face state rendered offscreen to PNG (Boo.exe --notch-gallery), uploaded with the UI smoke screenshots.
      - name: Notch face gallery
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'artifacts\ui-smoke\notch-gallery'
          $p = Start-Process -FilePath artifacts\ci\Boo.exe -ArgumentList '--notch-gallery', "`"$out`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "notch gallery exited with $($p.ExitCode)" }
          $png = Get-ChildItem $out -Filter *.png
          $png | ForEach-Object { "{0} {1} bytes" -f $_.Name, $_.Length }
          if ($png.Count -lt 10) { throw "expected 10 gallery PNGs, got $($png.Count)" }

      # Before/after evidence for the face polish: also render the gallery of the pre-polish commit, then print
      # both contact sheets as base64 between markers so reviewers without artifact access can read them from the log.
      - name: Check out the pre-polish commit (gallery before)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: 130a43af667e89c5c516c6e958fd0e52521d1265
          path: before-src

      - name: Notch gallery before/after (log dump)
        shell: pwsh
        continue-on-error: true
        run: |
          $bout = Join-Path $env:GITHUB_WORKSPACE 'artifacts\ui-smoke\notch-gallery-before'
          if (Test-Path before-src\src\Boo.App\Boo.App.csproj) {
            dotnet build before-src\src\Boo.App\Boo.App.csproj -c Release -o "$env:RUNNER_TEMP\before-bin" | Select-Object -Last 3
            $p = Start-Process -FilePath "$env:RUNNER_TEMP\before-bin\Boo.exe" -ArgumentList '--notch-gallery', "`"$bout`"" -Wait -PassThru
            "before gallery exit $($p.ExitCode)"
          }
          Add-Type -AssemblyName System.Drawing
          foreach ($pair in @(@('BEFORE', $bout), @('AFTER', (Join-Path $env:GITHUB_WORKSPACE 'artifacts\ui-smoke\notch-gallery')))) {
            $file = Join-Path $pair[1] '00-contact-sheet.png'
            if (-not (Test-Path $file)) { "no $($pair[0]) contact sheet"; continue }
            $src = [System.Drawing.Image]::FromFile($file)
            $w = [int]($src.Width / 2); $h = [int]($src.Height / 2)
            $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.InterpolationMode = 'HighQualityBicubic'; $g.DrawImage($src, 0, 0, $w, $h); $g.Dispose()
            $ms = New-Object System.IO.MemoryStream; $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
            $b64 = [Convert]::ToBase64String($ms.ToArray())
            "=====GALLERY-$($pair[0])-BEGIN====="
            for ($i = 0; $i -lt $b64.Length; $i += 3000) { $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i)) }
            "=====GALLERY-$($pair[0])-END====="
          }

      # Native UI smoke run (FlaUI) against the published Boo.exe on the runner's interactive desktop.
      # Not part of Boo.sln, so it is built here. Uses a temp BOO_DATA_DIR and restores HKCU Run.
      - name: Build UI smoke tests
        run: dotnet build tests/Boo.Ui.Tests -c Release

      - name: UI smoke tests (published Boo.exe)
        timeout-minutes: 10
        env:
          BOO_UI_EXE: ${{ github.workspace }}\artifacts\ci\Boo.exe
          BOO_UI_ARTIFACTS: ${{ github.workspace }}\artifacts\ui-smoke
        run: dotnet test tests/Boo.Ui.Tests -c Release --no-build --logger trx --logger "console;verbosity=detailed" --results-directory artifacts/test-results/ui

      - name: Upload UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: artifacts/ui-smoke
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
