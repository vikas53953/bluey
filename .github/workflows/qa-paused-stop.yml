name: qa-paused-stop
on:
  # No-key focused coverage runs on relevant PRs; dispatch is available after workflow registration.
  pull_request:
    paths:
      - tools/Boo.QaSuite/Journeys/PausedStopTests.cs
      - .github/workflows/qa-paused-stop.yml
  workflow_dispatch:
    inputs:
      typed_chat:
        description: Run existing S2 and J2 typed chat checks with cheap real OpenAI (two requests)
        type: boolean
        default: false
      basic_hover:
        description: Run existing S1 and J1 hover checks (key seeded; no AI requests)
        type: boolean
        default: false
      hotkey:
        description: Run existing S0 and J0 hotkey checks (key seeded; no AI requests)
        type: boolean
        default: false
      hover_edges:
        description: Run no-key Q7 four-branch hover journey instead of Q12G
        type: boolean
        default: false
      approval_stop:
        description: Run Q12E with one real cheap OpenAI request instead of no-key Q12G
        type: boolean
        default: false
      focus_resume:
        description: Run no-key Q13R Pause/Resume instead of Q12G
        type: boolean
        default: false
      focus_end:
        description: Run no-key Q13H End-from-Paused timing instead of Q12G
        type: boolean
        default: false
      face_timing_diagnostics:
        description: Narrow producer timing only, requires focus_end; diagnostic result is not acceptance
        type: boolean
        default: false
      tray_stop:
        description: Run no-key Q12F actual tray Stop instead of Q12G
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  paused-stop:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Refuse unless GitHub's own VM
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'GitHub hosted VM required; never the owner PC.' }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned app and harness (no AI key)
        shell: pwsh
        run: |
          dotnet publish src/Boo.App/Boo.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/paused-stop-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/Boo.QaSuite -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ inputs.hotkey || inputs.basic_hover || inputs.typed_chat }}' -eq 'true') {
            dotnet build tools/Boo.VerifyLive -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force artifacts/paused-stop | Out-Null
          "app=$(git rev-parse HEAD)`nharness=$(git rev-parse HEAD)`nworkflow=$(git rev-parse HEAD)" | Set-Content artifacts/paused-stop/identity.txt
          Get-FileHash artifacts/paused-stop-app/Boo.exe | Format-List | Out-File artifacts/paused-stop/exe-hash.txt
      - name: One selected Stop journey (no retries)
        shell: pwsh
        env:
          BOO_UI_EXE: ${{ github.workspace }}\artifacts\paused-stop-app\Boo.exe
          BOO_UI_ARTIFACTS: ${{ github.workspace }}\artifacts\paused-stop
          BOO_CAPTURE_SCOPE: boo-windows
          BOO_LIVE_TEXT_PROVIDER: openai
          BOO_LIVE_MODEL: gpt-6-luna
          BOO_LIVE_OPENAI_KEY: ${{ (inputs.approval_stop || inputs.hotkey || inputs.basic_hover || inputs.typed_chat) && secrets.BOO_LIVE_OPENAI_KEY || '' }}
          BOO_QA_FACE_TIMING: ${{ inputs.face_timing_diagnostics && '1' || '0' }}
          TRAY_STOP: ${{ inputs.tray_stop || false }}
          HOVER_EDGES: ${{ inputs.hover_edges || false }}
          HOTKEY: ${{ inputs.hotkey || false }}
          BASIC_HOVER: ${{ inputs.basic_hover || false }}
          TYPED_CHAT: ${{ inputs.typed_chat || false }}
          FOCUS_END: ${{ inputs.focus_end || false }}
          FOCUS_RESUME: ${{ inputs.focus_resume || false }}
          APPROVAL_STOP: ${{ inputs.approval_stop || false }}
        run: |
          $test = 'Boo.QaSuite.Journeys.PausedStopTests.Q12G_StopWhilePaused_PreservesSessionStatusAndPinnedFace'
          $selected = @($env:APPROVAL_STOP, $env:FOCUS_RESUME, $env:FOCUS_END, $env:TRAY_STOP, $env:HOVER_EDGES, $env:HOTKEY, $env:BASIC_HOVER, $env:TYPED_CHAT) | Where-Object { $_ -eq 'true' }
          if ($env:BOO_QA_FACE_TIMING -eq '1' -and $env:FOCUS_END -ne 'true') { throw 'Producer timing requires focus_end' }
          if (@($selected).Count -gt 1) { throw 'Choose one focused journey' }
          if ($env:HOVER_EDGES -eq 'true') { $test = 'Boo.QaSuite.Journeys.HoverEdgeTests.Q7_HoverEdges_AllFourBranches_OnTheRealClock' }
          if ($env:HOTKEY -eq 'true') { $test = 'Boo.QaSuite.Journeys.QaJourneyTests.S0_Launch_OnlyTheNotch_ThenHotkeyOpensThePanel' }
          if ($env:BASIC_HOVER -eq 'true') { $test = 'Boo.QaSuite.Journeys.QaJourneyTests.S1_Hover_WakesTheNotch_ThenItRetracts' }
          if ($env:TYPED_CHAT -eq 'true') { $test = 'Boo.QaSuite.Journeys.QaJourneyTests.S2_RealChat_EchoesARunTimeCode_AndTheNotchThinksThenResponds' }
          if ($env:TRAY_STOP -eq 'true') { $test = 'Boo.QaSuite.Journeys.TrayStopTests.Q12F_TrayStop_PausesRunningFocusAndKeepsItPinned' }
          if ($env:FOCUS_END -eq 'true') { $test = 'Boo.QaSuite.Journeys.FocusEndTimingTests.Q13H_EndFromPaused_HappyIntervalContainsNominalDurationThenRetreats' }
          if ($env:FOCUS_RESUME -eq 'true') { $test = 'Boo.QaSuite.Journeys.FocusResumeTests.Q13R_PauseResume_OrdersFacesAndRetainsSessionAtPauseCheckpoint' }
          if ($env:APPROVAL_STOP -eq 'true') { $test = 'Boo.QaSuite.Journeys.ApprovalStopTests.Q12E_NotchRightClick_ClearsPendingProposalAndAcknowledgesStop' }
          dotnet test tools/Boo.QaSuite -c Release --no-build --filter "FullyQualifiedName=$test" --logger trx --results-directory artifacts/paused-stop/trx
          $testExit = $LASTEXITCODE
          $results = @(Get-ChildItem artifacts/paused-stop/trx -Filter *.trx)
          if ($results.Count -ne 1) { throw 'Expected one TRX receipt' }
          [xml]$trx = Get-Content $results[0].FullName -Raw
          $rows = @($trx.TestRun.Results.UnitTestResult)
          if ($rows.Count -ne 1 -or $rows[0].outcome -ne 'Passed' -or $rows[0].testName -ne $test) { throw 'Exact selected journey did not pass' }
          if ($testExit -ne 0) { exit $testExit }
          if ($env:HOTKEY -eq 'true' -or $env:BASIC_HOVER -eq 'true' -or $env:TYPED_CHAT -eq 'true') {
            $test = 'Boo.VerifyLive.LiveJourneyTests.J0_NotchWakes_OnHotkey'
            if ($env:BASIC_HOVER -eq 'true') { $test = 'Boo.VerifyLive.LiveJourneyTests.J1_NotchWakes_OnHover' }
            if ($env:TYPED_CHAT -eq 'true') { $test = 'Boo.VerifyLive.LiveJourneyTests.J2_TypedChat_GetsARealAnswer' }
            dotnet test tools/Boo.VerifyLive -c Release --no-build --filter "FullyQualifiedName=$test" --logger trx --results-directory artifacts/paused-stop/verifylive-trx
            $testExit = $LASTEXITCODE
            $results = @(Get-ChildItem artifacts/paused-stop/verifylive-trx -Filter *.trx)
            if ($results.Count -ne 1) { throw 'Expected one selected verify-live TRX receipt' }
            [xml]$trx = Get-Content $results[0].FullName -Raw
            $rows = @($trx.TestRun.Results.UnitTestResult)
            if ($rows.Count -ne 1 -or $rows[0].outcome -ne 'Passed' -or $rows[0].testName -ne $test) { throw 'Exact selected verify-live check did not pass' }
          }
          exit $testExit
      - name: Prepare evidence scanner
        if: ${{ always() }}
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary=:all: -r scripts/ci/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Key scan before upload
        id: keyscan_artifacts_paused_stop
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $rc = 98
          try { python -I scripts/quality/key_scan.py --preflight --delete artifacts/paused-stop; $rc = $LASTEXITCODE } catch { $rc = 99 }
          if ($rc -eq 0 -or $rc -eq 10) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'safe=true' }
          if ($rc -eq 0) { exit 0 }
          if ($rc -ne 10) { Remove-Item -LiteralPath 'artifacts/paused-stop' -Recurse -Force -ErrorAction SilentlyContinue }
          if ($rc -ne 10 -and (Test-Path -LiteralPath 'artifacts/paused-stop')) { '::error::BOO-SAFE-002 the upload path could not be emptied after a failed key scan' }
          exit 1
      - name: Upload journey evidence
        if: ${{ !cancelled() && steps.keyscan_artifacts_paused_stop.outputs.safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-paused-stop
          if-no-files-found: error
          retention-days: 7
          path: artifacts/paused-stop
