name: crash-reopen

# CRASH-AND-REOPEN (sprint item 5(d)): the published Boo.exe, driven like a user with FlaUI, is killed in the middle of a
# focus session and launched again on the same data folder; tools/Boo.CrashReopen asserts it reopens cleanly with its
# state intact (one Boo, no crash notice, the interrupted session kept as Paused with its saved progress and shown in
# history, nothing still running, settings unchanged).
#
# No key and no AI call: this workflow reads NO secrets. It runs on every pull request (about 5 minutes on a hosted
# Windows VM, $0) and by hand. RUNS ONLY ON GITHUB'S OWN WINDOWS VM (windows-latest), never a personal PC: it drives
# the mouse and keyboard. Screenshots are Boo's own windows only (BOO_CAPTURE_SCOPE).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crash-reopen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  crash-reopen:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      BOO_CAPTURE_SCOPE: boo-windows
    steps:
      - name: Refuse unless this is GitHub's own VM (never the owner's PC)
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            "::error title=Crash-reopen refused::This job runs only on a GitHub-hosted runner (runner environment: '$($env:RUNNER_ENVIRONMENT)')."
            exit 1
          }
          "Runner: GitHub-hosted ($env:RUNNER_OS, $env:ImageOS)."

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Start with an empty evidence folder
        shell: pwsh
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts\crash-reopen-evidence'
          if (Test-Path $evidence) { Remove-Item $evidence -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PyYAML for the key scan (hash-pinned)
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes --only-binary=:all: -r scripts/ci/requirements-ci.txt

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Boo and build the crash-reopen test
        run: |
          dotnet restore Boo.sln
          dotnet publish src/Boo.App/Boo.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/live
          dotnet build tools/Boo.CrashReopen -c Release

      - name: Kill Boo mid-session and reopen it (FlaUI against the published Boo.exe)
        timeout-minutes: 15
        shell: pwsh
        env:
          BOO_UI_EXE: ${{ github.workspace }}\artifacts\live\Boo.exe
          BOO_UI_ARTIFACTS: ${{ github.workspace }}\artifacts\crash-reopen-evidence
        run: |
          & dotnet test tools/Boo.CrashReopen -c Release --no-build --logger trx --logger "console;verbosity=normal" --results-directory artifacts/crash-reopen-evidence/trx
          $testExit = $LASTEXITCODE
          '----- observations -----'
          Get-ChildItem artifacts/crash-reopen-evidence -Filter *.txt -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike '*.capture.txt' } | Sort-Object Name | ForEach-Object { "## $($_.Name)"; Get-Content $_.FullName }
          exit $testExit

      - name: Test gate (the test ran and passed; no empty or skipped run)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/ci/assert-tests-ran.ps1 -ResultsDirectory artifacts/crash-reopen-evidence/trx -SourceDirectory tools/Boo.CrashReopen

      - name: Key scan before upload (crash-reopen evidence)
        id: keyscan_artifacts_crash_reopen_evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $rc = 98
          try { python -I scripts/quality/key_scan.py --preflight --delete artifacts/crash-reopen-evidence; $rc = $LASTEXITCODE } catch { $rc = 99 }
          if ($rc -eq 0 -or $rc -eq 10) { Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'safe=true' }
          if ($rc -eq 0) { exit 0 }
          if ($rc -ne 10) { Remove-Item -LiteralPath 'artifacts/crash-reopen-evidence' -Recurse -Force -ErrorAction SilentlyContinue }
          if ($rc -ne 10 -and (Test-Path -LiteralPath 'artifacts/crash-reopen-evidence')) { '::error::BOO-SAFE-002 the upload path could not be emptied after a failed key scan' }
          exit 1

      - name: Upload crash-reopen evidence (screenshots, observations, test results)
        if: ${{ !cancelled() && steps.keyscan_artifacts_crash_reopen_evidence.outputs.safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: crash-reopen-evidence
          path: artifacts/crash-reopen-evidence
          if-no-files-found: warn
          retention-days: 14
